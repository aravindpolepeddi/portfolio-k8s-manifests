apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: portfolio-dev
spec:
  ingressClassName: nginx
  rules:
    - host: "portfolio.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-frontend-service
                port:
                  number: 8080